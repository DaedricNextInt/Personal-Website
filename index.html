<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Snap-Rotating Cube with Clickable Buttons</title>
    <style>
        body { margin: 0; overflow: hidden; position: relative; }
        canvas { display: block; }
        .cube-button {
            position: absolute;
            padding: 8px 12px;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

<script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Create materials - one side with an image, others with colors
    const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }), // Right side - red
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // Left side - green
        new THREE.MeshBasicMaterial({ color: 0x0000ff }), // Top side - blue
        new THREE.MeshBasicMaterial({ color: 0xffff00 }), // Bottom side - yellow
        new THREE.MeshBasicMaterial({ color: 0xff00ff }), // Front side - purple
        new THREE.MeshBasicMaterial({ 
            map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/crate.gif'),
            color: 0xffffff 
        }) // Back side - image
    ];

    // Create cube with different materials for each face
    const geometry = new THREE.BoxGeometry();
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    // Position camera
    camera.position.z = 5;

    // Target rotations for snapping
    const targetRotations = {
        front: { x: 0, y: 0 },
        right: { x: 0, y: Math.PI / 2 },
        back: { x: 0, y: Math.PI },
        left: { x: 0, y: -Math.PI / 2 },
        top: { x: -Math.PI / 2, y: 0 },
        bottom: { x: Math.PI / 2, y: 0 }
    };

    // Current target rotation
    let targetRotation = { ...targetRotations.front };
    const rotationSpeed = 0.1;

    // Handle keyboard input
    window.addEventListener('keydown', (event) => {
        switch(event.code) {
            case 'ArrowUp':
                targetRotation = { ...targetRotations.top };
                break;
            case 'ArrowDown':
                targetRotation = { ...targetRotations.bottom };
                break;
            case 'ArrowLeft':
                targetRotation = { ...targetRotations.left };
                break;
            case 'ArrowRight':
                targetRotation = { ...targetRotations.right };
                break;
            case 'Space':
                targetRotation = { ...targetRotations.front };
                break;
        }
    });

    // Button positions in local cube space
    const buttonPositions = [
        new THREE.Vector3(1, 0, 0),  // Right
        new THREE.Vector3(-1, 0, 0), // Left
        new THREE.Vector3(0, 1, 0),  // Top
        new THREE.Vector3(0, -1, 0), // Bottom
        new THREE.Vector3(0, 0, 1),  // Front
        new THREE.Vector3(0, 0, -1)  // Back
    ];

    // Create buttons and add to document
    const buttons = [];
    const buttonLabels = ["Right", "Left", "Top", "Bottom", "Front", "Back"];
    
    buttonLabels.forEach((label, index) => {
        const button = document.createElement("button");
        button.className = "cube-button";
        button.innerText = label;
        button.onclick = () => alert(`${label} side clicked!`);
        document.body.appendChild(button);
        buttons.push(button);
    });

    // Function to update button positions
    function updateButtonPositions() {
        buttons.forEach((button, index) => {
            const vector = buttonPositions[index].clone();
            vector.applyQuaternion(cube.quaternion); // Rotate button with cube
            vector.project(camera); // Convert 3D position to screen coordinates

            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (1 - (vector.y * 0.5 + 0.5)) * window.innerHeight;

            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        });
    }

    // Animation loop with smooth snapping
    function animate() {
        requestAnimationFrame(animate);
        
        // Smoothly interpolate to target rotation
        cube.rotation.x += (targetRotation.x - cube.rotation.x) * rotationSpeed;
        cube.rotation.y += (targetRotation.y - cube.rotation.y) * rotationSpeed;
        
        updateButtonPositions();
        renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateButtonPositions();
    });

    animate();
</script>

</body>
</html>
